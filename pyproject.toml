[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-trainer"
version = "0.1.0"
description = "Voice driving coach for Assetto Corsa"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
actrainer = "actrainer.cli:main"

[tool.setuptools.packages.find]
include = ["actrainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/gitgc/ac-trainer"
